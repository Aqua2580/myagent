name: myagent

services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-18.4-alpine3.23}
    restart: unless-stopped
    init: true
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myagent}
      POSTGRES_USER: ${POSTGRES_USER:-myagent}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
      PGTZ: UTC
      TZ: UTC
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - backend

  redis:
    image: redis:${REDIS_IMAGE_TAG:-8.8.0-alpine3.23}
    restart: unless-stopped
    init: true
    command:
      - redis-server
      - /run/secrets/redis_config
    secrets:
      - redis_config
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(awk '$$1 == "requirepass" {print $$2}' /run/secrets/redis_config)" redis-cli --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - backend

secrets:
  postgres_password:
    file: ./docker/secrets/postgres_password.txt
  redis_config:
    file: ./docker/secrets/redis.conf

volumes:
  postgres_data:
    name: myagent-postgres-data
  redis_data:
    name: myagent-redis-data

networks:
  backend:
    name: myagent-backend
    internal: true
